{% if pode_decidir and item.estado == 'SUBMETIDO' %}
<form method="post" action="{% url 'candidaturas:decidir' tipo item.pk %}" class="mt-3">
  {% csrf_token %}
  <textarea name="comentario" rows="2" class="form-control form-control-sm mb-2" placeholder="Comentário (obrigatório para pedir correcção)"></textarea>
  <div class="d-flex gap-2">
    <button type="submit" name="acao" value="validar" class="btn btn-success btn-sm"><i class="bi bi-check-lg me-1"></i>Validar</button>
    <button type="submit" name="acao" value="corrigir" class="btn btn-outline-danger btn-sm">Pedir correcção</button>
  </div>
</form>
{% endif %}
