{% if vaga.estado == 'ABERTA' %}<span class="badge text-bg-success"><i class="bi bi-door-open me-1"></i>{{ vaga.get_estado_display }}</span>
{% elif vaga.estado == 'ENCERRADA' %}<span class="badge text-bg-danger"><i class="bi bi-door-closed me-1"></i>{{ vaga.get_estado_display }}</span>
{% elif vaga.estado == 'EM_ANALISE' %}<span class="badge text-bg-warning"><i class="bi bi-search me-1"></i>{{ vaga.get_estado_display }}</span>
{% else %}<span class="badge text-bg-secondary"><i class="bi bi-pencil me-1"></i>{{ vaga.get_estado_display }}</span>{% endif %}
